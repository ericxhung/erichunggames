<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>太空引力模擬 - 70804 Eric</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --google-blue: #8ab4f8;
            --google-surface: #202124;
            --google-outline: #3c4043;
            --google-on-surface: #e8eaed;
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #0b0b0b; 
            color: var(--google-on-surface); 
            font-family: 'Google Sans', 'Roboto', sans-serif; 
            touch-action: none; 
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none; 
        }

        canvas { display: block; }

        .m3-surface {
            background-color: rgba(32, 33, 36, 0.9);
            border: 1px solid var(--google-outline);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
        }

        .m3-button {
            border-radius: 20px;
            padding: 10px 24px;
            font-weight: 500;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .m3-button-filled { background-color: var(--google-blue); color: #202124; }
        .m3-button-tonal { background-color: #303134; color: var(--google-blue); }

        .custom-context-menu {
            position: fixed;
            display: none;
            z-index: 7000; 
            background: var(--google-surface);
            border: 1px solid var(--google-outline);
            padding: 24px;
            border-radius: 28px;
            min-width: 280px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.9);
        }
        
        .modal-overlay { 
            background: rgba(0,0,0,0.85); 
            display: none !important; 
            backdrop-filter: blur(10px); 
            position: fixed;
            inset: 0;
            z-index: 6000;
        }
        .modal-overlay.active { display: flex !important; }

        .menu-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 6500;
            backdrop-filter: blur(2px);
        }

        input[type="number"], input[type="text"] {
            background: #121314;
            border: 1px solid var(--google-outline);
            border-radius: 12px;
            color: white;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            margin-top: 4px;
        }

        label {
            display: block;
            font-size: 10px;
            color: #9ca3af;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.05em;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.6); opacity: 1; }
            100% { transform: scale(1.8); opacity: 0; }
        }
        .touch-ring {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 3px solid var(--google-blue);
            border-radius: 50%;
            pointer-events: none;
            animation: pulse-ring 0.6s ease-out infinite;
            display: none;
            z-index: 500;
        }

        /* 優化滾動條 */
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: var(--google-blue);
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>
<body>

            <div class="pt-4 border-t border-google-outline flex flex-col gap-2">

                </button>

    <!-- 統計數據面板 -->

</div>

<!-- 重置確認彈窗 -->

            <button onclick="confirmReset('empty')" class="m3-button m3-button-tonal">清空</button>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const touchRing = document.getElementById('touch-indicator');
const backdrop = document.getElementById('menu-backdrop');

let isTouchMode = false;
let currentMousePos = { x: 0, y: 0 }; 

// --- 物理引擎 ---
const G = 0.5; 
let bodies = [];
let isPaused = false;
let timeScale = 0.2; 
let zoom = 1.0;
let offsetX = 0, offsetY = 0;
let animationId = null;

class Body {
    constructor(x, y, vx, vy, mass, radius, color, name) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.mass = mass; this.radius = radius; this.color = color; this.name = name;
        this.trail = [];
        this.isDragged = false;
        this.isAiming = false; 
    }
    draw() {
        const sx = (this.x * zoom) + offsetX;
        const sy = (this.y * zoom) + offsetY;
        const sr = Math.max(1, this.radius * zoom);

        // 軌跡繪製
        if (this.trail.length > 2) {
            ctx.beginPath();
            ctx.strokeStyle = this.color + '33'; 
            ctx.lineWidth = 1.5;
            ctx.moveTo((this.trail[0].x * zoom) + offsetX, (this.trail[0].y * zoom) + offsetY);
            for(let i=1; i<this.trail.length; i++) {
                ctx.lineTo((this.trail[i].x * zoom) + offsetX, (this.trail[i].y * zoom) + offsetY);
            }
            ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(sx, sy, sr, 0, Math.PI * 2);
        ctx.fillStyle = this.isDragged ? '#ffffff' : (this.isAiming ? '#ffdd00' : this.color);
        if (this.mass > 500) {
            ctx.shadowBlur = (this.isDragged || this.isAiming ? 25 : 10) * zoom;
            ctx.shadowColor = this.color;
        }
        ctx.fill();
        ctx.shadowBlur = 0;

        // 右鍵同向彈射箭頭
        if (this.isAiming && currentMousePos) {
            const dx = currentMousePos.x - sx;
            const dy = currentMousePos.y - sy;
            const dist = Math.hypot(dx, dy);
            if (dist > 5) {
                const angle = Math.atan2(dy, dx);
                const hue = Math.max(0, 200 - dist/3); 
                ctx.save();
                ctx.strokeStyle = `hsla(${hue}, 90%, 65%, 0.8)`;
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.setLineDash([10, 5]);
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(currentMousePos.x, currentMousePos.y);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.beginPath();
                ctx.translate(currentMousePos.x, currentMousePos.y);
                ctx.rotate(angle);
                ctx.moveTo(0, 0); ctx.lineTo(-18, -10); ctx.lineTo(-18, 10);
                ctx.closePath();
                ctx.fillStyle = `hsla(${hue}, 90%, 65%, 0.9)`;
                ctx.fill();
                ctx.restore();
                ctx.fillStyle = "white";
                ctx.font = "bold 14px 'Google Sans'";
                ctx.textAlign = "left";
                ctx.fillText(`發射威力: ${Math.round(dist)}`, currentMousePos.x + 20, currentMousePos.y);
            }
        }

        if (zoom > 0.5) {
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.font = `${Math.max(12, 13 * zoom)}px "Google Sans"`;
            ctx.textAlign = 'center';
            ctx.fillText(this.name || "Planet", sx, sy + sr + 18 * zoom);
        }
    }
    updatePhysics(others, dt) {
        if (isPaused || this.isDragged || this.isAiming) return;
        others.forEach(other => {
            if (other === this || other.isDragged || other.isAiming) return;
            const dx = other.x - this.x;
            const dy = other.y - this.y;
            const distSq = dx * dx + dy * dy + 1; 
            const dist = Math.sqrt(distSq);
            if (dist < (this.radius + other.radius) * 0.75) {
                this.merge(other); return;
            }
            const f = (G * other.mass) / distSq;
            this.vx += (f * dx / dist) * dt;
            this.vy += (f * dy / dist) * dt;
        });
    }
    move(dt) {
        if (!isPaused && !this.isDragged && !this.isAiming) {
            this.x += this.vx * dt; this.y += this.vy * dt;
        }
    }
    merge(other) {
        if (!bodies.includes(other) || !bodies.includes(this)) return;
        const bigger = this.mass >= other.mass ? this : other;
        const smaller = this.mass >= other.mass ? other : this;
        const totalMass = bigger.mass + smaller.mass;
        bigger.vx = (bigger.vx * bigger.mass + smaller.vx * smaller.mass) / totalMass;
        bigger.vy = (bigger.vy * bigger.mass + smaller.vy * smaller.mass) / totalMass;
        bigger.radius = Math.pow(Math.pow(bigger.radius, 3) + Math.pow(smaller.radius, 3), 1/3);
        bigger.mass = totalMass;
        bodies.splice(bodies.indexOf(smaller), 1);
    }
}

// --- 初始化星系 ---
function initSolarSystem() {
    bodies = [];
    const EM = 100; const AU = 350;
    const sun = new Body(0, 0, 0, 0, EM * 3330, 48, '#fdb813', '太陽');
    bodies.push(sun);
    const planetData = [[0.38, 0.05, 0.4, '#97979f', '水星'], [0.72, 0.81, 0.9, '#e3bb76', '金星'], [1.0, 1.0, 1.0, '#2277ff', '地球'], [1.52, 0.1, 0.5, '#ff5533', '火星']];
    planetData.forEach(([dAU, mE, rE, col, name]) => {
        const d = dAU * AU; const v = Math.sqrt((G * sun.mass) / d);
        bodies.push(new Body(d, 0, 0, v, mE * EM, rE * 9, col, name));
    });
}

function initNStarSystem(n, starMassInput) {
    bodies = [];
    const mass = starMassInput || 3000;
    const starRadius = Math.max(10, Math.pow(mass / 100, 1/3) * 10);
    const minSafeChord = starRadius * 8; 
    const calculatedR = minSafeChord / (2 * Math.sin(Math.PI / n));
    const R = Math.max(280, calculatedR);
    let netForceFactor = 0;
    for (let i = 1; i < n; i++) {
        const angle = (i * 2 * Math.PI) / n;
        const dist = 2 * R * Math.sin(angle / 2);
        netForceFactor += (Math.sin(angle / 2)) / (dist * dist);
    }
    const v = Math.sqrt(G * mass * netForceFactor * R);
    for (let i = 0; i < n; i++) {
        const angle = (i * 2 * Math.PI) / n;
        const x = R * Math.cos(angle); const y = R * Math.sin(angle);
        const vx = -v * Math.sin(angle); const vy = v * Math.cos(angle);
        bodies.push(new Body(x, y, vx, vy, mass, starRadius, `hsl(${(i * 360) / n}, 80%, 70%)`, `星體 ${i+1}`));
    }
}

function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (!isPaused) {
        const subSteps = 8; const dt = timeScale / subSteps;
        for (let s = 0; s < subSteps; s++) {
            bodies.forEach(b => b.updatePhysics(bodies, dt));
            bodies.forEach(b => b.move(dt));
        }
        bodies.forEach(b => {
            if (!b.isDragged && !b.isAiming) {
                b.trail.push({x: b.x, y: b.y});
                if (b.trail.length > 70) b.trail.shift();
            }
        });
    }
    bodies.forEach(b => b.draw());
    document.getElementById('count-val').innerText = bodies.length;
    const totalM = bodies.reduce((sum, b) => sum + b.mass, 0);
    document.getElementById('mass-val').innerText = Math.round(totalM).toLocaleString();
    animationId = requestAnimationFrame(loop);
}

// --- 互動邏輯 ---
let isDragging = false, dragTarget = null;
let lastPinchDist = null;
let longPressTimer = null;
let lastInteractionPos = { x: 0, y: 0 };
let currentContextTarget = null;
let startTouchPos = { x: 0, y: 0 };

window.addEventListener('contextmenu', e => {
    if (e.target.tagName === 'INPUT') return;
    e.preventDefault();
    const moveDist = Math.hypot(e.clientX - startTouchPos.x, e.clientY - startTouchPos.y);
    if (!isTouchMode && moveDist < 5) {
        const wx = (e.clientX - offsetX) / zoom;
        const wy = (e.clientY - offsetY) / zoom;
        const target = bodies.find(b => Math.sqrt((b.x-wx)**2 + (b.y-wy)**2) < b.radius + 35/zoom);
        lastInteractionPos = { x: e.clientX, y: e.clientY };
        showContextMenu(e.clientX, e.clientY, target);
    }
}, false);

function handlePress(x, y, isTouch = false, btn = 0) {
    if (document.elementFromPoint(x, y)?.closest('.m3-surface, .custom-context-menu')) return;
    const wx = (x - offsetX) / zoom;
    const wy = (y - offsetY) / zoom;
    const target = bodies.find(b => Math.sqrt((b.x-wx)**2 + (b.y-wy)**2) < b.radius + 35/zoom);
    
    hideContextMenu();
    lastInteractionPos = { x, y };
    startTouchPos = { x, y };
    isDragging = true;
    currentMousePos = { x, y };

    if (target) {
        dragTarget = target;
        if (btn === 2) { 
            dragTarget.isAiming = true;
            dragTarget.trail = [];
        } else { 
            dragTarget.isDragged = true;
            dragTarget.trail = []; 
        }
    } else {
        dragTarget = { type: 'camera', lastX: x, lastY: y };
    }

    clearTimeout(longPressTimer);
    if (isTouchMode || isTouch) {
        touchRing.style.left = (x - 40) + 'px';
        touchRing.style.top = (y - 40) + 'px';
        touchRing.style.display = 'block';
        longPressTimer = setTimeout(() => {
            const moveDist = Math.hypot(x - startTouchPos.x, y - startTouchPos.y);
            if (moveDist < 10) {
                isDragging = false;
                if (dragTarget && dragTarget.isDragged) dragTarget.isDragged = false;
                touchRing.style.display = 'none';
                showContextMenu(x, y, target);
                if (navigator.vibrate) navigator.vibrate(60);
            }
        }, 650); 
    }
}

function handleMove(x, y) {
    currentMousePos = { x, y };
    if (!isDragging || !dragTarget) return;
    if (Math.hypot(x - startTouchPos.x, y - startTouchPos.y) > 15) {
        clearTimeout(longPressTimer);
        touchRing.style.display = 'none';
    }
    if (dragTarget.isAiming) return;
    const wx = (x - offsetX) / zoom;
    const wy = (y - offsetY) / zoom;
    if (dragTarget.type === 'camera') {
        offsetX += (x - dragTarget.lastX);
        offsetY += (y - dragTarget.lastY);
        dragTarget.lastX = x; dragTarget.lastY = y;
    } else {
        dragTarget.x = wx; dragTarget.y = wy;
    }
}

function handleEnd() {
    if (dragTarget) {
        if (dragTarget.isAiming) {
            const sx = (dragTarget.x * zoom) + offsetX;
            const sy = (dragTarget.y * zoom) + offsetY;
            const dx = (currentMousePos.x - sx) / zoom;
            const dy = (currentMousePos.y - sy) / zoom;
            const speedFactor = 0.05;
            dragTarget.vx = dx * speedFactor;
            dragTarget.vy = dy * speedFactor;
            dragTarget.isAiming = false;
        }
        dragTarget.isDragged = false;
    }
    isDragging = false;
    dragTarget = null;
    clearTimeout(longPressTimer);
    touchRing.style.display = 'none';
}

canvas.addEventListener('mousedown', e => handlePress(e.clientX, e.clientY, false, e.button));
canvas.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
canvas.addEventListener('mouseup', handleEnd);

canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const scaleFactor = e.deltaY > 0 ? 0.9 : 1.1;
    const midX = e.clientX, midY = e.clientY;
    const wx = (midX - offsetX) / zoom;
    const wy = (midY - offsetY) / zoom;
    zoom = Math.min(Math.max(zoom * scaleFactor, 0.01), 30);
    offsetX = midX - wx * zoom;
    offsetY = midY - wy * zoom;
}, { passive: false });

canvas.addEventListener('touchstart', e => {
    if (e.target.closest('.m3-surface, .custom-context-menu')) return;
    e.preventDefault();
    if (e.touches.length === 1) handlePress(e.touches[0].clientX, e.touches[0].clientY, true);
    else if (e.touches.length === 2) {
        handleEnd();
        lastPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
    if (e.target.closest('.m3-surface, .custom-context-menu')) return;
    e.preventDefault();
    if (e.touches.length === 1) handleMove(e.touches[0].clientX, e.touches[0].clientY);
    else if (e.touches.length === 2) {
        const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        const scale = dist / lastPinchDist;
        const wx = (midX - offsetX) / zoom;
        const wy = (midY - offsetY) / zoom;
        zoom = Math.min(Math.max(zoom * scale, 0.01), 30);
        offsetX = midX - wx * zoom;
        offsetY = midY - wy * zoom;
        lastPinchDist = dist;
    }
}, { passive: false });
canvas.addEventListener('touchend', handleEnd);

// --- 介面功能 ---
function detectDevice() {
    isTouchMode = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    updateUIForMode();
}

function updateUIForMode() {
    const icon = document.getElementById('device-icon');
    const text = document.getElementById('device-text');
    const label = document.getElementById('mode-label');
    if (isTouchMode) {
        icon.innerText = "📱"; text.innerText = "長按 0.6s 選單 / 雙指縮放"; label.innerText = "行動裝置";
    } else {
        icon.innerText = "💻"; text.innerText = "滑鼠拖曳 / 右鍵同向彈射"; label.innerText = "電腦";
    }
}

function toggleDeviceMode() { isTouchMode = !isTouchMode; updateUIForMode(); }

function showContextMenu(x, y, target) {
    const menu = document.getElementById('context-menu');
    menu.style.display = 'block'; backdrop.style.display = 'block';
    if (!isTouchMode) {
        menu.style.left = Math.min(x, window.innerWidth - 300) + 'px';
        menu.style.top = Math.min(y, window.innerHeight - 450) + 'px';
    } else {
        menu.style.left = '50%'; menu.style.top = '50%';
        menu.style.transform = 'translate(-50%, -50%)';
    }
    currentContextTarget = target;
    if (target) {
        document.getElementById('edit-mode-section').classList.remove('hidden');
        document.getElementById('add-mode-section').classList.add('hidden');
        document.getElementById('edit-name').value = target.name;
        document.getElementById('edit-mass').value = Math.round(target.mass);
    } else {
        document.getElementById('edit-mode-section').classList.add('hidden');
        document.getElementById('add-mode-section').classList.remove('hidden');
    }
}

function hideContextMenu() { 
    const menu = document.getElementById('context-menu');
    menu.style.display = 'none'; 
    menu.style.transform = ''; 
    backdrop.style.display = 'none'; 
}

document.getElementById('btn-save-edit').onclick = () => {
    if (currentContextTarget) {
        currentContextTarget.name = document.getElementById('edit-name').value;
        const m = parseFloat(document.getElementById('edit-mass').value);
        currentContextTarget.mass = m;
        currentContextTarget.radius = Math.max(5, Math.pow(m / 100, 1/3) * 10);
    }
    hideContextMenu();
};

document.getElementById('btn-confirm-add').onclick = () => {
    const wx = (lastInteractionPos.x - offsetX) / zoom;
    const wy = (lastInteractionPos.y - offsetY) / zoom;
    const name = document.getElementById('add-name').value || "新天體";
    const mass = parseFloat(document.getElementById('add-mass').value) || 200;
    const radius = parseFloat(document.getElementById('add-radius').value) || 12;
    bodies.push(new Body(wx, wy, 0, 0, mass, radius, '#8ab4f8', name));
    hideContextMenu();
};

document.getElementById('btn-delete').onclick = () => {
    if (currentContextTarget) bodies.splice(bodies.indexOf(currentContextTarget), 1);
    hideContextMenu();
};

function startGame(type) {
    document.getElementById('home-screen').classList.add('hidden');
    document.getElementById('game-ui').classList.remove('hidden');
    document.getElementById('show-panel-btn').classList.add('hidden'); // 開始時面板是開著的，隱藏按鈕
    if (type === 'solar') initSolarSystem();
    else if (type === 'empty') bodies = [];
    offsetX = canvas.width / 2; offsetY = canvas.height / 2;
    if (!animationId) loop();
}

function promptNStars() { isPaused = true; document.getElementById('n-star-modal').classList.add('active'); }
function hideNStarModal() { document.getElementById('n-star-modal').classList.remove('active'); isPaused = false; }
function confirmNStars() {
    initNStarSystem(parseInt(document.getElementById('n-count').value), parseFloat(document.getElementById('n-mass').value));
    startGame('nstar'); hideNStarModal();
}

// 修改 togglePanel 邏輯，避免按鈕與面板重疊
function togglePanel(v) { 
    document.getElementById('game-ui').classList.toggle('hidden', !v); 
    document.getElementById('show-panel-btn').classList.toggle('hidden', v); 
}

function pauseGame() { isPaused = !isPaused; document.getElementById('pause-btn').innerText = isPaused ? '繼續' : '暫停'; }
function resetZoom() { zoom = 1; offsetX = canvas.width/2; offsetY = canvas.height/2; }
function showResetModal() { isPaused = true; document.getElementById('reset-modal').classList.add('active'); }
function hideResetModal() { document.getElementById('reset-modal').classList.remove('active'); isPaused = false; }
function confirmReset(type) { startGame(type); hideResetModal(); resetZoom(); }

document.getElementById('time-scale').oninput = e => { 
    timeScale = parseFloat(e.target.value); 
    document.getElementById('time-val').innerText = timeScale.toFixed(1) + 'x'; 
};

window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
detectDevice();
</script>
