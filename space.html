<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>太空引力模擬 - 70804 Eric</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --google-blue: #8ab4f8;
            --google-surface: #202124;
            --google-outline: #3c4043;
            --google-on-surface: #e8eaed;
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #0b0b0b; 
            color: var(--google-on-surface); 
            font-family: 'Google Sans', 'Roboto', sans-serif; 
            touch-action: none; 
            -webkit-user-select: none;
            user-select: none;
        }

        canvas { display: block; }

        .m3-surface {
            background-color: rgba(32, 33, 36, 0.95);
            border: 1px solid var(--google-outline);
            border-radius: 28px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(16px);
        }

        .m3-button {
            border-radius: 20px;
            padding: 12px 24px;
            font-weight: 500;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .m3-button-filled { background-color: var(--google-blue); color: #202124; }
        .m3-button-tonal { background-color: #303134; color: var(--google-blue); }

        .modal-overlay { 
            background: rgba(0,0,0,0.85); 
            display: none !important; 
            backdrop-filter: blur(10px); 
            position: fixed;
            inset: 0;
            z-index: 8000;
        }
        .modal-overlay.active { display: flex !important; }

        input[type="number"], input[type="text"] {
            background: #121314;
            border: 1px solid var(--google-outline);
            border-radius: 12px;
            color: white;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            margin-top: 4px;
        }

        label {
            display: block;
            font-size: 10px;
            color: #9ca3af;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.05em;
        }

        /* 自定義捲軸 */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--google-outline); border-radius: 10px; }
    </style>
</head>
<body>
<iframe 
    src="nav.html" 
    style="
        width: 100%; 
        height: 64px; 
        border: none; 
        position: fixed; /* 強制固定 */
        top: 0;          /* 貼緊頂部 */
        left: 0;         /* 貼緊左側 */
        z-index: 9999;   /* 確保最前 */
        background: #ffffff;
    " 
    scrolling="no">
</iframe>
<!-- 首頁螢幕 -->
<div id="home-screen" class="fixed inset-0 flex items-center justify-center z-[5000] bg-[#0b0b0b]">
    <div class="text-center p-8 m3-surface w-[90%] max-w-md">
        <h1 class="text-3xl font-bold mb-2 text-white">引力實驗室</h1>
        <p class="text-gray-400 mb-6">由 70804 Eric 開發</p>
        <div id="status-chip" class="inline-flex items-center px-4 py-1.5 rounded-full bg-blue-900/30 text-blue-300 text-xs font-medium mb-8">
            <span id="device-icon" class="mr-2">🔍</span>
            <span id="device-text">偵測中...</span>
        </div>
        <div class="flex flex-col gap-3">
            <button onclick="startGame('solar')" class="m3-button m3-button-tonal">太陽系模式</button>
            <button onclick="promptNStars(true)" class="m3-button m3-button-filled">自定義 N 星系統</button>
            <button onclick="startGame('empty')" class="m3-button m3-button-tonal">進入空宇宙模式</button>
        </div>
    </div>
</div>

<!-- 控制面板顯示按鈕 (移動到左下角) -->
<div id="show-panel-btn" class="fixed bottom-6 left-6 z-[100] w-12 h-12 bg-[#8ab4f8] text-black rounded-2xl flex items-center justify-center cursor-pointer shadow-xl hidden" onclick="togglePanel(true)">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
</div>

<!-- 側邊 UI 容器 (移動到左下角) -->
<div id="game-ui" class="fixed bottom-6 left-6 z-[40] hidden flex flex-col-reverse gap-3 pointer-events-none">
    <!-- 統計數據 -->
    <div id="stats" class="m3-surface p-4 text-[11px] text-gray-400 flex flex-col gap-1.5 w-48 pointer-events-auto">
        <div class="flex justify-between items-center"><span>星體數量</span><span id="count-val" class="text-white font-bold">0</span></div>
        <div class="flex justify-between items-center"><span>總質量</span><span id="mass-val" class="text-white font-bold">0</span></div>
    </div>

    <!-- 主面板 -->
    <div id="main-panel" class="m3-surface p-6 relative w-72 pointer-events-auto">
        <button onclick="togglePanel(false)" class="absolute top-5 right-5 text-gray-500 hover:text-white transition-colors">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 9l-7 7-7-7"/></svg>
        </button>
        <h2 class="text-xl font-bold text-white mb-6">控制面板</h2>
        <div class="space-y-6">
            <div>
                <div class="flex justify-between text-xs mb-3 text-gray-400 font-medium">
                    <span>時間流速</span>
                    <span id="time-val" class="text-blue-300">0.2x</span>
                </div>
                <input type="range" id="time-scale" min="0" max="5" step="0.1" value="0.2" class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="pauseGame()" id="pause-btn" class="m3-button m3-button-tonal text-sm font-bold">暫停</button>
                <button onclick="resetZoom()" class="m3-button m3-button-tonal text-sm font-bold">重置視角</button>
            </div>
            <div class="pt-4 border-t border-google-outline flex flex-col gap-2">
                <button onclick="toggleDeviceMode()" class="m3-button bg-[#303134] text-gray-300 text-xs py-2">模式：<span id="mode-label" class="ml-1 text-blue-300">自動</span></button>
                <button onclick="showResetModal()" class="m3-button border border-red-900/50 text-red-400 text-sm py-2">重置宇宙</button>
            </div>
        </div>
    </div>
</div>

<!-- N 星系統彈窗 -->
<div id="n-star-modal" class="modal-overlay items-center justify-center p-4">
    <div class="m3-surface p-8 w-full max-w-sm">
        <h3 class="text-2xl font-bold mb-6 text-white text-center">建立 N 星系統</h3>
        <div class="space-y-5 mb-8">
            <div><label>恆星數量 (2-12)</label><input type="number" id="n-count" value="3"></div>
            <div><label>單星質量</label><input type="number" id="n-mass" value="3000"></div>
        </div>
        <div class="flex flex-col gap-3">
            <button onclick="confirmNStars()" class="m3-button m3-button-filled py-4 text-lg">生成系統</button>
            <button onclick="hideNStarModal()" id="n-cancel-btn" class="m3-button m3-button-tonal">返回</button>
        </div>
    </div>
</div>

<!-- 重置彈窗 -->
<div id="reset-modal" class="modal-overlay items-center justify-center p-4">
    <div class="m3-surface p-8 max-w-xs w-full text-center">
        <h3 class="text-2xl font-bold mb-6 text-white">重置宇宙</h3>
        <div class="flex flex-col gap-3">
            <button onclick="confirmReset('solar')" class="m3-button m3-button-tonal">太陽系</button>
            <button onclick="promptNStars(false)" class="m3-button m3-button-filled">N 星系統</button>
            <button onclick="confirmReset('empty')" class="m3-button m3-button-tonal">清空</button>
            <button onclick="hideResetModal()" class="mt-4 text-gray-500 text-sm">取消</button>
        </div>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let bodies = [];
let isPaused = false;
let timeScale = 0.2; 
let zoom = 1.0;
let offsetX = 0, offsetY = 0;
let isFromHome = false;
const G = 1.0; // 引力常數

// --- 物理類 ---
class Body {
    constructor(x, y, vx, vy, mass, radius, color, name) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.mass = mass; this.radius = radius; this.color = color; this.name = name;
        this.trail = [];
    }
    draw() {
        const sx = (this.x * zoom) + offsetX;
        const sy = (this.y * zoom) + offsetY;
        const sr = Math.max(1, this.radius * zoom);
        
        if (this.trail.length > 2) {
            ctx.beginPath();
            ctx.strokeStyle = this.color + '33';
            ctx.lineWidth = 1.5;
            ctx.moveTo((this.trail[0].x * zoom) + offsetX, (this.trail[0].y * zoom) + offsetY);
            for(let i=1; i<this.trail.length; i++) ctx.lineTo((this.trail[i].x * zoom) + offsetX, (this.trail[i].y * zoom) + offsetY);
            ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(sx, sy, sr, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        
        if (zoom > 0.5) {
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.font = '12px "Google Sans"';
            ctx.textAlign = 'center';
            ctx.fillText(this.name, sx, sy + sr + 15);
        }
    }
}

// --- 核心流程 ---
function startGame(type) {
    document.getElementById('home-screen').classList.add('hidden');
    document.getElementById('game-ui').classList.remove('hidden');
    document.getElementById('show-panel-btn').classList.add('hidden');
    
    if (type === 'solar') initSolar();
    else if (type === 'empty') bodies = [];
    
    offsetX = canvas.width / 2; offsetY = canvas.height / 2;
    if (!window.isRunning) { window.isRunning = true; loop(); }
}

function promptNStars(fromHome) {
    isFromHome = fromHome;
    isPaused = true;
    
    const cancelBtn = document.getElementById('n-cancel-btn');
    if (fromHome) {
        cancelBtn.onclick = () => {
            hideNStarModal();
            document.getElementById('home-screen').classList.remove('hidden');
        };
        document.getElementById('home-screen').classList.add('hidden');
    } else {
        cancelBtn.onclick = hideNStarModal;
        hideResetModal();
    }
    
    document.getElementById('n-star-modal').classList.add('active');
}

function confirmNStars() {
    const n = parseInt(document.getElementById('n-count').value);
    const m = parseFloat(document.getElementById('n-mass').value);
    initNStars(n, m);
    hideNStarModal();
    startGame('nstar');
}

function hideNStarModal() {
    document.getElementById('n-star-modal').classList.remove('active');
    isPaused = false;
}

function initSolar() {
    bodies = [];
    const sun = new Body(0, 0, 0, 0, 333000, 45, '#fdb813', '太陽');
    bodies.push(sun);
    bodies.push(new Body(350, 0, 0, 30, 100, 10, '#2277ff', '地球'));
}

function initNStars(n, mass) {
    bodies = [];
    const R = 250;
    
    // 計算多星系統中維持圓周運動所需的初速
    // 公式：v = sqrt( (G * M / R) * Sum_{j=1}^{n-1} [ 1 / (4 * sin(j*PI/n)) ] )
    let sumSines = 0;
    for (let j = 1; j < n; j++) {
        sumSines += 1 / (4 * Math.sin((j * Math.PI) / n));
    }
    const v = Math.sqrt((G * mass / R) * sumSines);

    for (let i = 0; i < n; i++) {
        const ang = (i * 2 * Math.PI) / n;
        const px = R * Math.cos(ang);
        const py = R * Math.sin(ang);
        const vx = -v * Math.sin(ang);
        const vy = v * Math.cos(ang);
        bodies.push(new Body(px, py, vx, vy, mass, 15, `hsl(${i * (360/n)}, 70%, 60%)`, `星體 ${i+1}`));
    }
}

function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (!isPaused) {
        // 物理計算
        for (let i=0; i<bodies.length; i++) {
            for (let j=i+1; j<bodies.length; j++) {
                const b1 = bodies[i], b2 = bodies[j];
                const dx = b2.x - b1.x, dy = b2.y - b1.y;
                const distSq = dx*dx + dy*dy + 10; // 軟化因子防止近距離無限引力
                const dist = Math.sqrt(distSq);
                const force = (G * b1.mass * b2.mass) / distSq;
                
                const ax = (force * dx / dist) * timeScale;
                const ay = (force * dy / dist) * timeScale;
                
                b1.vx += ax / b1.mass;
                b1.vy += ay / b1.mass;
                b2.vx -= ax / b2.mass;
                b2.vy -= ay / b2.mass;
            }
        }
        bodies.forEach(b => {
            b.x += b.vx * timeScale; 
            b.y += b.vy * timeScale;
            b.trail.push({x: b.x, y: b.y});
            if (b.trail.length > 100) b.trail.shift();
        });
    }
    bodies.forEach(b => b.draw());
    
    document.getElementById('count-val').innerText = bodies.length;
    let totalMass = bodies.reduce((s, b) => s + b.mass, 0);
    document.getElementById('mass-val').innerText = Math.round(totalMass).toLocaleString();
    
    requestAnimationFrame(loop);
}

function togglePanel(v) {
    document.getElementById('game-ui').classList.toggle('hidden', !v);
    document.getElementById('show-panel-btn').classList.toggle('hidden', v);
}
function pauseGame() { isPaused = !isPaused; document.getElementById('pause-btn').innerText = isPaused ? '繼續' : '暫停'; }
function resetZoom() { zoom = 1; offsetX = canvas.width/2; offsetY = canvas.height/2; }
function showResetModal() { isPaused = true; document.getElementById('reset-modal').classList.add('active'); }
function hideResetModal() { document.getElementById('reset-modal').classList.remove('active'); isPaused = false; }
function confirmReset(type) { hideResetModal(); startGame(type); resetZoom(); }
function toggleDeviceMode() {}

document.getElementById('time-scale').oninput = e => { 
    timeScale = parseFloat(e.target.value); 
    document.getElementById('time-val').innerText = timeScale.toFixed(1) + 'x'; 
};

window.addEventListener('resize', () => { 
    canvas.width = window.innerWidth; 
    canvas.height = window.innerHeight; 
    offsetX = canvas.width / 2;
    offsetY = canvas.height / 2;
});
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
</script>
</body>
</html>
