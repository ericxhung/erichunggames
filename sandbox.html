<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2D 物理沙盒</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: #2a2a2a;
            --accent-color: #2196F3;
            --text-color: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        header {
            padding: 10px;
            background: var(--panel-bg);
            border-bottom: 1px solid #444;
            text-align: center;
            flex-shrink: 0;
        }

        h2 { margin: 0; font-size: 1.2rem; }

        .main-container {
            display: flex;
            flex-direction: row;
            flex-grow: 1;
            overflow: hidden;
        }

        /* 物品欄：在手機上會自動移到下方或縮小 */
        .controls {
            width: 220px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            grid-auto-rows: min-content;
            gap: 8px;
            background: var(--panel-bg);
            border-right: 1px solid #444;
            overflow-y: auto;
        }

        /* 畫布容器：佔滿剩餘空間 */
        .canvas-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        canvas {
            image-rendering: pixelated;
            max-width: 100%;
            max-height: 100%;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: crosshair;
            object-fit: contain;
        }

        /* 下方設定欄位：響應式排列 */
        .settings {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 12px;
            background: var(--panel-bg);
            border-top: 1px solid #444;
            justify-content: space-around;
            align-items: center;
            flex-shrink: 0;
        }

        .setting-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            white-space: nowrap;
        }

        button {
            padding: 8px 4px;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            color: #fff;
            transition: transform 0.1s, border-color 0.2s;
            background: #444;
        }

        button:active { transform: scale(0.95); }
        button.selected { border-color: #fff; outline: 2px solid var(--accent-color); }

        .view-btn { padding: 6px 15px; }
        .view-btn.active { background: var(--accent-color); }

        #clearBtn { 
            grid-column: 1 / -1; 
            background: #d32f2f;
            margin-top: 10px;
        }

        input[type="range"] {
            width: 100px;
            cursor: pointer;
        }

        input[type="number"] {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 4px;
            width: 50px;
            border-radius: 4px;
            text-align: center;
        }

        /* 行動裝置適應 */
        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .controls {
                width: 100%;
                height: 150px;
                border-right: none;
                border-bottom: 1px solid #444;
                grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            }
            .settings { padding: 8px; gap: 10px; }
            input[type="range"] { width: 80px; }
        }
    </style>
</head>
<body>
<iframe 
    src="nav.html" 
    style="
        width: 100%; 
        height: 64px; 
        border: none; 
        display: block; /* 讓它變成區塊元素，自動佔據一行 */
        margin: 0;
        padding: 0;
    " 
    scrolling="no">
</iframe>
    <header>
        <h2>2D 物理沙盒 By 70804 洪旭辰</h2>
    </header>
    
    <div class="main-container">
        <div class="controls" id="toolbar">
            <button style="background:#e3c07e; color:#000" data-type="SAND" class="selected">沙子</button>
            <button style="background:#888" data-type="STONE">石頭</button>
            <button style="background:#555" data-type="IRON">鐵</button>
            <button style="background:#8b4513" data-type="WOOD">木頭</button>
            <button style="background:#222" data-type="COAL">煤炭</button>
            <button style="background:#4040ff" data-type="WATER">水</button>
            <button style="background:#4b3621" data-type="OIL">原油</button>
            <button style="background:#7fff00; color:#000" data-type="ACID">酸液</button>
            <button style="background:#ffaa00; color:#000" data-type="FIRE">火</button>
            <button style="background:#444" data-type="GUNPOWDER">火藥</button>
            <button style="background:#f00" data-type="TNT">TNT</button>
            <button style="background:#ff4500" data-type="LAVA">岩漿</button>
            <button style="background:#c0c0c0; color:#000" data-type="GALLIUM">鎵</button>
            <button style="background:#aaddff; color:#000" data-type="ICE">冰</button>
            <button style="background:#5c4033" data-type="DIRT">土壤</button>
            <button style="background:#d2b48c; color:#000" data-type="SEED">種子</button>
            <button style="background:#ffcc00; color:#000" data-type="BATTERY">電池</button>
            <button style="background:#333; color:#0ff; border:1px solid #0ff" data-type="WIRE">電線</button>
            <button style="background:#ffffaa; color:#000" data-type="BULB">燈泡</button>
            <button style="background:#fff; color:#000" data-type="EMPTY">橡皮擦</button>
            <button id="clearBtn">全部清空</button>
        </div>

        <div class="canvas-container" id="container">
            <canvas id="sandbox"></canvas>
        </div>
    </div>

    <div class="settings">
        <div class="setting-group">
            <b>視角:</b>
            <button class="view-btn active" id="viewNormal">一般</button>
            <button class="view-btn" id="viewThermal">熱成像</button>
        </div>
        <div class="setting-group">
            環境: <input type="range" id="ambientRange" min="-100" max="1000" value="20"> 
            <input type="number" id="ambientNum" value="20">°C
        </div>
        <div class="setting-group">
            速度: <input type="range" id="speedRange" min="0.5" max="3" step="0.5" value="1"> 
            <input type="number" id="speedNum" value="1" step="0.5">
        </div>
        <div class="setting-group">
            筆刷: <input type="range" id="brushRange" min="1" max="50" value="11"> 
            <input type="number" id="brushNum" value="11">
        </div>
    </div>

<script>
// --- 核心邏輯與常數 ---
const canvas = document.getElementById('sandbox');
const ctx = canvas.getContext('2d', { alpha: false });
const container = document.getElementById('container');

// 邏輯解析度 (固定，確保物理計算一致)
const width = 320, height = 240;
const idx = (x, y) => x + y * width;

// 元素常量
const EMPTY = 0, SAND = 1, STONE = 2, IRON = 3, WOOD = 4, 
      COAL = 5, WATER = 6, OIL = 7, ACID = 8, FIRE = 9, 
      TNT = 10, STEAM = 11, SMOKE = 12, LAVA = 13, GALLIUM = 14, ICE = 15,
      DIRT = 16, WET_DIRT = 17, WET_SAND = 18, SEED = 19, PLANT = 20,
      GUNPOWDER = 21, BATTERY = 22, WIRE = 23, BULB = 24;

const ELEMENT_MAP = { 
    "SAND": SAND, "STONE": STONE, "IRON": IRON, "WOOD": WOOD, 
    "COAL": COAL, "WATER": WATER, "OIL": OIL, "ACID": ACID, 
    "LAVA": LAVA, "FIRE": FIRE, "TNT": TNT, "GALLIUM": GALLIUM, "ICE": ICE, 
    "DIRT": DIRT, "SEED": SEED, "EMPTY": EMPTY, "GUNPOWDER": GUNPOWDER,
    "BATTERY": BATTERY, "WIRE": WIRE, "BULB": BULB
};

const PROPS = {
    [EMPTY]:     { coolRate: 0.8,  conduct: 0.02,  density: 0, state: 'gas' },
    [SAND]:      { coolRate: 0.1,  conduct: 0.15, density: 100, state: 'solid' },
    [WET_SAND]:  { coolRate: 0.2,  conduct: 0.4,  density: 120, state: 'solid' },
    [DIRT]:      { coolRate: 0.08, conduct: 0.12, density: 90, state: 'solid' },
    [WET_DIRT]:  { coolRate: 0.15, conduct: 0.35, density: 110, state: 'solid' },
    [SEED]:      { igniteTemp: 250, coolRate: 0.1,  conduct: 0.2,  density: 95, state: 'solid' },
    [PLANT]:     { igniteTemp: 220, coolRate: 0.05, conduct: 0.25, density: 1000, state: 'solid' },
    [STONE]:     { coolRate: 0.05, conduct: 0.2,  density: 1000, isWall: true, state: 'solid' },
    [ICE]:       { coolRate: 0.05, conduct: 0.3,  density: 90, baseTemp: -20, state: 'solid' },
    [IRON]:      { coolRate: 0.02, conduct: 0.95, density: 1000, isWall: true, isConductor: true, state: 'solid' },
    [GALLIUM]:   { coolRate: 0.05, conduct: 0.8,  density: 120, meltPoint: 30, viscosity: 3, isConductor: true, state: 'liquid' },
    [WOOD]:      { igniteTemp: 210, coolRate: 0.03, conduct: 0.28, density: 1000, isWall: true, state: 'solid' }, 
    [COAL]:      { igniteTemp: 380, coolRate: 0.01, conduct: 0.25, density: 1000, isWall: true, state: 'solid' }, 
    [WATER]:     { coolRate: 0.8,  conduct: 0.5,  viscosity: 1, density: 10, state: 'liquid' },
    [OIL]:       { igniteTemp: 125, coolRate: 0.15, conduct: 0.35, viscosity: 1.5, density: 5, state: 'liquid' }, 
    [ACID]:      { coolRate: 0.2,  conduct: 0.1,  viscosity: 1.2, density: 11, state: 'liquid' },
    [FIRE]:      { coolRate: 0.8,  conduct: 0.85, baseTemp: 800, density: 0, state: 'gas' }, 
    [TNT]:       { igniteTemp: 180, coolRate: 0.1,  conduct: 0.35, density: 1000, state: 'solid' },
    [GUNPOWDER]: { igniteTemp: 150, coolRate: 0.1,  conduct: 0.2,  density: 80, state: 'solid' },
    [LAVA]:      { coolRate: 0.02, conduct: 0.7,  baseTemp: 1200, viscosity: 12, density: 20, state: 'liquid' },
    [STEAM]:     { coolRate: 0.5,  conduct: 0.05, density: -1, state: 'gas' },
    [SMOKE]:     { coolRate: 0.7,  conduct: 0.03, density: -1, state: 'gas' },
    [BATTERY]:   { coolRate: 0.1,  conduct: 0.5,  density: 1000, isWall: true, isConductor: true, state: 'solid' },
    [WIRE]:      { coolRate: 0.1,  conduct: 0.9,  density: 1000, isWall: true, isConductor: true, state: 'solid' },
    [BULB]:      { coolRate: 0.1,  conduct: 0.5,  density: 1000, isWall: true, isConductor: true, state: 'solid' }
};

const COLORS_HEX = {
    [EMPTY]: 0xFF000000, [SAND]: 0xFF7EC0E3, [WET_SAND]: 0xFF4D8BB3, 
    [DIRT]: 0xFF33405C, [WET_DIRT]: 0xFF1F2B3D, [STONE]: 0xFF888888, [IRON]: 0xFF555555,
    [WOOD]: 0xFF13458B, [COAL]: 0xFF222222, [WATER]: 0xFFFF4040, [OIL]: 0xFF21364B,
    [ACID]: 0xFF00FF7F, [FIRE]: 0xFF0045FF, [TNT]: 0xFF0000FF, [STEAM]: 0xFFFFDDDD, 
    [SMOKE]: 0xFF666666, [LAVA]: 0xFF0045FF, [GALLIUM]: 0xFFC0C0C0, [ICE]: 0xFFFFDDAA,
    [SEED]: 0xFF8CB4D2, [PLANT]: 0xFF578B2E, [GUNPOWDER]: 0xFF444444,
    [BATTERY]: 0xFF00CCFF, [WIRE]: 0xFF333333, [BULB]: 0xFF555555
};

// 狀態網格
let grid = new Uint8Array(width * height);
let tempGrid = new Float32Array(width * height);
let lifeGrid = new Int16Array(width * height);
let chargeGrid = new Float32Array(width * height);

let nextGrid = new Uint8Array(width * height);
let nextTemp = new Float32Array(width * height);
let nextCharge = new Float32Array(width * height);

let currentElement = SAND, isInteracting = false, lastX = 0, lastY = 0;
let mouseX = -1, mouseY = -1;
let simSteps = 1, brushSize = 11, ambientTemp = 20; 
let visualMode = 'NORMAL'; 
let isRightClick = false;
let frameCount = 0;

const screenImg = ctx.createImageData(width, height);

// --- 響應式畫布調整 ---
function resizeCanvas() {
    const containerRect = container.getBoundingClientRect();
    const ratio = width / height;
    
    let newWidth, newHeight;
    if (containerRect.width / containerRect.height > ratio) {
        newHeight = containerRect.height;
        newWidth = newHeight * ratio;
    } else {
        newWidth = containerRect.width;
        newHeight = newWidth / ratio;
    }
    
    canvas.style.width = `${newWidth}px`;
    canvas.style.height = `${newHeight}px`;
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function place(x, y, type) {
    if (x < 0 || x >= width || y < 0 || y >= height) return;
    let i = idx(x, y);
    if (grid[i] !== EMPTY && type !== EMPTY && type !== FIRE && type !== LAVA) return;
    
    grid[i] = type;
    tempGrid[i] = PROPS[type].baseTemp !== undefined ? PROPS[type].baseTemp : ambientTemp;
    chargeGrid[i] = 0;
    
    if (type === FIRE) lifeGrid[i] = 30 + Math.random() * 25;
    else if (type === SMOKE) lifeGrid[i] = 30 + Math.random() * 40;
    else if (type === STEAM) lifeGrid[i] = 50 + Math.random() * 60;
    else if (type === SEED) lifeGrid[i] = 100;
    else if (type === PLANT) lifeGrid[i] = 300; 
    else lifeGrid[i] = 0;
}

function drawLine(x0, y0, x1, y1, type) {
    let dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
    let sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, err = dx - dy;
    let actualType = isRightClick ? EMPTY : type;
    while(true) {
        let b2 = brushSize * brushSize;
        for(let i = -brushSize; i <= brushSize; i++) {
            for(let j = -brushSize; j <= brushSize; j++) {
                if(i*i + j*j <= b2) place(x0 + i, y0 + j, actualType);
            }
        }
        if (x0 === x1 && y0 === y1) break;
        let e2 = 2 * err;
        if (e2 > -dy) { err -= dy; x0 += sx; }
        if (e2 < dx) { err += dx; y0 += sy; }
    }
}

function update() {
    if (isInteracting) drawLine(lastX, lastY, lastX, lastY, currentElement);

    let actualSteps = simSteps < 1 ? (frameCount % 2 === 0 ? 1 : 0) : Math.ceil(simSteps);

    for(let s = 0; s < actualSteps; s++) {
        nextGrid.set(grid);
        nextTemp.set(tempGrid);
        
        // 電力重置與源頭
        for(let i = 0; i < chargeGrid.length; i++) {
            nextCharge[i] = (grid[i] === BATTERY) ? 1.0 : 0; 
        }

        // 簡單導電模擬
        for(let iter = 0; iter < 2; iter++) {
            for(let i = 0; i < grid.length; i++) {
                if (!PROPS[grid[i]].isConductor) continue;
                let x = i % width, y = (i / width) | 0;
                const dx = [0, 0, -1, 1], dy = [-1, 1, 0, 0];
                for(let k = 0; k < 4; k++) {
                    let nid = idx(x + dx[k], y + dy[k]);
                    if (nid >= 0 && nid < grid.length && PROPS[grid[nid]].isConductor) {
                        if (nextCharge[i] < nextCharge[nid]) nextCharge[i] = nextCharge[nid];
                    }
                }
            }
        }

        // 熱與化學
        for(let i = 0; i < grid.length; i++) {
            let x = i % width, y = (i / width) | 0;
            let type = grid[i];

            // 溫度回歸環境
            if (type !== FIRE && type !== LAVA) {
                nextTemp[i] -= (nextTemp[i] - ambientTemp) * PROPS[type].coolRate * 0.1;
            }

            const dx = [0, 1], dy = [1, 0]; // 檢查部分鄰居減少計算
            for(let k = 0; k < 2; k++) {
                let nx = x + dx[k], ny = y + dy[k];
                if (nx < width && ny < height) {
                    let nid = idx(nx, ny);
                    let nType = grid[nid];

                    // 酸水反應 (含消耗)
                    if ((type === ACID && nType === WATER) || (type === WATER && nType === ACID)) {
                        nextTemp[i] += 10; nextTemp[nid] += 10;
                        if (nextTemp[i] > 80 && Math.random() < 0.2) {
                            let wIdx = (type === WATER) ? i : nid;
                            let aIdx = (type === ACID) ? i : nid;
                            nextGrid[wIdx] = STEAM; lifeGrid[wIdx] = 50;
                            if (Math.random() < 0.15) nextGrid[aIdx] = EMPTY; // 消耗酸
                        }
                    }

                    // 熱傳導
                    let tDiff = tempGrid[i] - tempGrid[nid];
                    let cond = (PROPS[type].conduct + PROPS[nType].conduct) * 0.1;
                    nextTemp[nid] += tDiff * cond;
                    nextTemp[i] -= tDiff * cond;
                }
            }
        }
        
        grid.set(nextGrid);
        tempGrid.set(nextTemp);
        chargeGrid.set(nextCharge);

        // 物理運動
        let processed = new Uint8Array(width * height);
        for (let y = height - 1; y >= 0; y--) {
            let lr = Math.random() > 0.5;
            for (let x = (lr ? 0 : width - 1); (lr ? x < width : x >= 0); (lr ? x++ : x--)) {
                let i = idx(x, y);
                let type = grid[i];
                if (type === EMPTY || processed[i]) continue;

                if (type === FIRE || type === SMOKE || type === STEAM) {
                    if (--lifeGrid[i] <= 0) { grid[i] = (type === FIRE && Math.random() < 0.3) ? SMOKE : EMPTY; continue; }
                }

                if (PROPS[type].isWall && type !== WIRE && type !== BULB) continue;

                // 爆炸
                if (type === TNT && (tempGrid[i] > 180 || chargeGrid[i] > 0.8)) { explode(x, y, 30); continue; }

                // 下落與液體流動
                if (PROPS[type].state === 'solid' && !PROPS[type].isWall) moveSolid(x, y, i, processed);
                else if (PROPS[type].state === 'liquid') moveLiquid(x, y, i, type, processed);
                else if (PROPS[type].state === 'gas') moveGas(x, y, i, type, processed);
            }
        }
    }
}

function moveSolid(x, y, i, processed) {
    if (y >= height - 1) return;
    let down = i + width;
    if (grid[down] === EMPTY) swap(i, down, processed);
    else if (x > 0 && grid[down - 1] === EMPTY) swap(i, down - 1, processed);
    else if (x < width - 1 && grid[down + 1] === EMPTY) swap(i, down + 1, processed);
}

function moveLiquid(x, y, i, type, processed) {
    if (y < height - 1 && grid[i + width] === EMPTY) swap(i, i + width, processed);
    else {
        let dir = Math.random() > 0.5 ? 1 : -1;
        if (x + dir >= 0 && x + dir < width && grid[i + dir] === EMPTY) swap(i, i + dir, processed);
    }
}

function moveGas(x, y, i, type, processed) {
    if (y > 0) {
        let dir = (Math.random() * 3 | 0) - 1;
        let target = idx(x + dir, y - 1);
        if (x+dir >= 0 && x+dir < width && grid[target] === EMPTY) swap(i, target, processed);
    } else if (Math.random() < 0.05) grid[i] = EMPTY;
}

function swap(a, b, processed) {
    let t = grid[a]; grid[a] = grid[b]; grid[b] = t;
    let te = tempGrid[a]; tempGrid[a] = tempGrid[b]; tempGrid[b] = te;
    let l = lifeGrid[a]; lifeGrid[a] = lifeGrid[b]; lifeGrid[b] = l;
    let c = chargeGrid[a]; chargeGrid[a] = chargeGrid[b]; chargeGrid[b] = c;
    if (processed) processed[b] = 1;
}

function explode(ex, ey, r) {
    for (let i = -r; i <= r; i++) {
        for (let j = -r; j <= r; j++) {
            if (i*i + j*j < r*r) {
                let tx = ex+i, ty = ey+j;
                if (tx >= 0 && tx < width && ty >= 0 && ty < height) {
                    let d = idx(tx, ty);
                    grid[d] = Math.random() < 0.3 ? FIRE : EMPTY;
                    tempGrid[d] = 1000; lifeGrid[d] = 20;
                }
            }
        }
    }
}

function draw() {
    const data32 = new Uint32Array(screenImg.data.buffer);
    for (let i = 0; i < grid.length; i++) {
        if (visualMode === 'NORMAL') {
            let color = COLORS_HEX[grid[i]];
            if (chargeGrid[i] > 0.1) {
                if (grid[i] === WIRE) color = 0xFF00AAFF;
                else if (grid[i] === BULB) color = 0xFFFFFFFF;
            }
            data32[i] = color;
        } else {
            let t = tempGrid[i];
            if (t < 0) data32[i] = 0xFFFF5500;
            else if (t < 40) data32[i] = 0xFFBB0000;
            else if (t < 100) data32[i] = 0xFF00AA00;
            else data32[i] = 0xFF0000FF;
        }
    }
    const off = document.createElement('canvas');
    off.width = width; off.height = height;
    off.getContext('2d').putImageData(screenImg, 0, 0);
    ctx.clearRect(0,0, canvas.width, canvas.height);
    ctx.drawImage(off, 0, 0, canvas.width, canvas.height);

    // 繪製筆刷外框
    if (mouseX >= 0) {
        const ratio = canvas.clientWidth / width;
        ctx.beginPath();
        ctx.strokeStyle = "white";
        ctx.arc(mouseX * ratio, mouseY * ratio, brushSize * ratio, 0, Math.PI*2);
        ctx.stroke();
    }
}

// 座標轉換
function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
        x: Math.floor(((clientX - rect.left) / rect.width) * width),
        y: Math.floor(((clientY - rect.top) / rect.height) * height)
    };
}

canvas.onmousedown = e => { isInteracting = true; isRightClick = (e.button === 2); let p = getPos(e); lastX = p.x; lastY = p.y; };
canvas.ontouchstart = e => { e.preventDefault(); isInteracting = true; let p = getPos(e); lastX = p.x; lastY = p.y; };
window.onmousemove = e => { let p = getPos(e); mouseX = p.x; mouseY = p.y; if(isInteracting) drawLine(lastX, lastY, p.x, p.y, currentElement); lastX = p.x; lastY = p.y; };
window.ontouchmove = e => { let p = getPos(e); mouseX = p.x; mouseY = p.y; if(isInteracting) drawLine(lastX, lastY, p.x, p.y, currentElement); lastX = p.x; lastY = p.y; };
window.onmouseup = window.ontouchend = () => { isInteracting = false; mouseX = -1; };
canvas.oncontextmenu = e => e.preventDefault();

// UI 控制
document.getElementById('toolbar').onclick = e => {
    const btn = e.target.closest('button');
    if (!btn || btn.id === 'clearBtn') return;
    document.querySelectorAll('#toolbar button').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    currentElement = ELEMENT_MAP[btn.getAttribute('data-type')];
};

document.getElementById('clearBtn').onclick = () => { grid.fill(0); tempGrid.fill(ambientTemp); chargeGrid.fill(0); };
document.getElementById('viewNormal').onclick = () => { visualMode = 'NORMAL'; document.getElementById('viewNormal').classList.add('active'); document.getElementById('viewThermal').classList.remove('active'); };
document.getElementById('viewThermal').onclick = () => { visualMode = 'THERMAL'; document.getElementById('viewThermal').classList.add('active'); document.getElementById('viewNormal').classList.remove('active'); };

// 滑桿與數值同步
const bindInput = (idR, idN, cb) => {
    const r = document.getElementById(idR), n = document.getElementById(idN);
    r.oninput = n.oninput = e => { r.value = n.value = e.target.value; cb(e.target.value); };
};
bindInput('ambientRange', 'ambientNum', v => ambientTemp = parseInt(v));
bindInput('speedRange', 'speedNum', v => simSteps = parseFloat(v));
bindInput('brushRange', 'brushNum', v => brushSize = parseInt(v));

function loop() { frameCount++; update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
