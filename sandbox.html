<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2D 物理沙盒 - 慢速燃燒優化版</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        header {
            width: 100%;
            text-align: center;
            padding: 5px 0;
            background: #222;
            border-bottom: 1px solid #444;
            flex-shrink: 0;
        }
        h2 { margin: 5px 0; font-size: 1.1rem; }
        .main-container {
            display: flex;
            flex-direction: row;
            width: 100%;
            flex-grow: 1;
            overflow: hidden;
        }
        .controls {
            width: 250px;
            padding: 8px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: min-content;
            gap: 6px;
            background: #333;
            border-right: 1px solid #444;
            overflow-y: auto;
        }
        .canvas-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            background: #1a1a1a;
            position: relative;
        }
        canvas {
            border: 2px solid #444;
            background-color: #000;
            image-rendering: pixelated;
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: crosshair;
        }
        .settings {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 8px;
            background: #222;
            width: 100%;
            font-size: 12px;
            border-top: 1px solid #444;
        }
        .setting-item {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        button {
            width: 100%;
            padding: 6px 2px;
            border: 2px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            color: #fff;
            transition: all 0.1s;
        }
        button:active { transform: scale(0.95); }
        .selected { border-color: white; box-shadow: 0 0 8px rgba(255,255,255,0.4); }
        .view-btn { width: auto; padding: 4px 12px; background: #444; }
        .view-btn.active { background: #2196F3; border-color: #fff; }
        #clearBtn { grid-column: span 3; margin-top: 5px; }
        input[type="number"] {
            background: #444; color: white; border: 1px solid #666;
            border-radius: 3px; width: 45px; padding: 2px; font-size: 11px;
        }
        input[type="range"] { width: 80px; }
    </style>
</head>
<body>
	<iframe 
		src="nav.html" 
		style="
		width: 100%; 
		height: 64px; 
		border: none; 
		position: fixed; /* 強制固定 */
		top: 0;          /* 貼緊頂部 */
		left: 0;         /* 貼緊左側 */
		z-index: 9999;   /* 確保最前 */
		background: #ffffff;
		" 
		scrolling="no">
	</iframe>
    <header>
        <h2>2D 物理沙盒 - 慢速燃燒優化版</h2>
    </header>
    
    <div class="main-container">
        <div class="controls" id="toolbar">
            <button style="background:#e3c07e; color:#000" data-type="SAND" class="selected">沙子</button>
            <button style="background:#888" data-type="STONE">石頭</button>
            <button style="background:#555" data-type="IRON">鐵</button>
            <button style="background:#8b4513" data-type="WOOD">木頭</button>
            <button style="background:#222" data-type="COAL">煤炭</button>
            <button style="background:#4040ff" data-type="WATER">水</button>
            <button style="background:#4b3621" data-type="OIL">原油</button>
            <button style="background:#7fff00; color:#000" data-type="ACID">酸液</button>
            <button style="background:#ffaa00; color:#000" data-type="FIRE">火</button>
            <button style="background:#444" data-type="GUNPOWDER">火藥</button>
            <button style="background:#f00" data-type="TNT">TNT</button>
            <button style="background:#ff4500" data-type="LAVA">岩漿</button>
            <button style="background:#c0c0c0; color:#000" data-type="GALLIUM">鎵</button>
            <button style="background:#aaddff; color:#000" data-type="ICE">冰</button>
            <button style="background:#5c4033" data-type="DIRT">土壤</button>
            <button style="background:#d2b48c; color:#000" data-type="SEED">種子</button>
            <button style="background:#ffcc00; color:#000" data-type="BATTERY">電池</button>
            <button style="background:#333; color:#0ff; border:1px solid #0ff" data-type="WIRE">電線</button>
            <button style="background:#ffffaa; color:#000" data-type="BULB">燈泡</button>
            <button style="background:#fff; color:#000" data-type="EMPTY">橡皮擦</button>
            <button style="background:#eee; color:#000" id="clearBtn">全部清空</button>
        </div>

        <div class="canvas-container">
            <canvas id="sandbox"></canvas>
        </div>
    </div>

    <div class="settings">
        <div class="setting-item">
            <b>視角:</b>
            <button class="view-btn active" id="viewNormal">一般</button>
            <button class="view-btn" id="viewThermal">熱成像</button>
        </div>
        <div class="setting-item">
            環境溫度: <input type="range" id="ambientRange" min="-100" max="1000" value="20"> <input type="number" id="ambientNum" value="20">°C
            模擬速度: <input type="range" id="speedRange" min="1" max="10" value="4"> <input type="number" id="speedNum" value="4">
            筆刷大小: <input type="range" id="brushRange" min="1" max="50" value="8"> <input type="number" id="brushNum" value="8">
        </div>
    </div>

<script>
// --- 核心配置 ---
const canvas = document.getElementById('sandbox');
const ctx = canvas.getContext('2d', { alpha: false });
const width = 320, height = 240, cellSize = 2;
canvas.width = width * cellSize;
canvas.height = height * cellSize;
ctx.imageSmoothingEnabled = false;

// 元素常量
const EMPTY = 0, SAND = 1, STONE = 2, IRON = 3, WOOD = 4, 
      COAL = 5, WATER = 6, OIL = 7, ACID = 8, FIRE = 9, 
      TNT = 10, STEAM = 11, SMOKE = 12, LAVA = 13, GALLIUM = 14, ICE = 15,
      DIRT = 16, WET_DIRT = 17, WET_SAND = 18, SEED = 19, PLANT = 20,
      GUNPOWDER = 21, BATTERY = 22, WIRE = 23, BULB = 24;

const ELEMENT_MAP = { 
    "SAND": SAND, "STONE": STONE, "IRON": IRON, "WOOD": WOOD, 
    "COAL": COAL, "WATER": WATER, "OIL": OIL, "ACID": ACID, 
    "LAVA": LAVA, "FIRE": FIRE, "TNT": TNT, "GALLIUM": GALLIUM, "ICE": ICE, 
    "DIRT": DIRT, "SEED": SEED, "EMPTY": EMPTY, "GUNPOWDER": GUNPOWDER,
    "BATTERY": BATTERY, "WIRE": WIRE, "BULB": BULB
};

// 物理與化學屬性
const PROPS = {
    [EMPTY]:     { coolRate: 0.7,  conduct: 0.1,  density: 0 },
    [SAND]:      { coolRate: 0.1,  conduct: 0.15, density: 100 },
    [WET_SAND]:  { coolRate: 0.2,  conduct: 0.4,  density: 120 },
    [DIRT]:      { coolRate: 0.08, conduct: 0.12, density: 90 },
    [WET_DIRT]:  { coolRate: 0.15, conduct: 0.35, density: 110, viscosity: 5 },
    [SEED]:      { igniteTemp: 250, coolRate: 0.1,  conduct: 0.2,  density: 95 },
    [PLANT]:     { igniteTemp: 220, coolRate: 0.05, conduct: 0.25, density: 1000 },
    [STONE]:     { coolRate: 0.05, conduct: 0.2,  density: 1000, isWall: true, strength: 50 },
    [ICE]:       { coolRate: 0.05, conduct: 0.3,  density: 90, baseTemp: -20 },
    [IRON]:      { coolRate: 0.02, conduct: 0.95, density: 1000, isWall: true, strength: 120, isConductor: true },
    [GALLIUM]:   { coolRate: 0.05, conduct: 0.8,  density: 120, meltPoint: 30, viscosity: 3, isConductor: true },
    [WOOD]:      { igniteTemp: 210, coolRate: 0.03, conduct: 0.28, density: 1000, strength: 20 }, 
    [COAL]:      { igniteTemp: 380, coolRate: 0.02, conduct: 0.18, density: 1000 },
    [WATER]:     { coolRate: 0.8,  conduct: 0.5,  viscosity: 1, density: 10, freezePoint: 0, isConductor: true },
    [OIL]:       { igniteTemp: 125, coolRate: 0.15, conduct: 0.35, viscosity: 1.5, density: 5 }, 
    [ACID]:      { coolRate: 0.2,  conduct: 0.1,  viscosity: 1, density: 11 },
    [FIRE]:      { coolRate: 0.7,  conduct: 0.85, baseTemp: 800, density: 0 }, // 稍微降低冷卻速度讓火焰維持久一點
    [TNT]:       { igniteTemp: 180, coolRate: 0.1,  conduct: 0.35, density: 1000 },
    [GUNPOWDER]: { igniteTemp: 150, coolRate: 0.1,  conduct: 0.2,  density: 80 },
    [LAVA]:      { coolRate: 0.02, conduct: 0.7,  baseTemp: 1200, viscosity: 12, density: 20 },
    [STEAM]:     { coolRate: 0.5,  conduct: 0.05, density: -1 },
    [SMOKE]:     { coolRate: 0.7,  conduct: 0.03, density: -1 },
    [BATTERY]:   { coolRate: 0.1,  conduct: 0.5,  density: 1000, isWall: true, isConductor: true },
    [WIRE]:      { coolRate: 0.1,  conduct: 0.9,  density: 1000, isWall: true, isConductor: true },
    [BULB]:      { coolRate: 0.1,  conduct: 0.5,  density: 1000, isWall: true, isConductor: true }
};

const COLORS_HEX = {
    [EMPTY]: 0xFF000000, [SAND]: 0xFF7EC0E3, [WET_SAND]: 0xFF4D8BB3, 
    [DIRT]: 0xFF33405C, [WET_DIRT]: 0xFF1F2B3D, [STONE]: 0xFF888888, [IRON]: 0xFF555555,
    [WOOD]: 0xFF13458B, [COAL]: 0xFF222222, [WATER]: 0xFFFF4040, [OIL]: 0xFF21364B,
    [ACID]: 0xFF00FF7F, [FIRE]: 0xFF0045FF, [TNT]: 0xFF0000FF, [STEAM]: 0xFFFFDDDD, 
    [SMOKE]: 0xFF666666, [LAVA]: 0xFF0045FF, [GALLIUM]: 0xFFC0C0C0, [ICE]: 0xFFFFDDAA,
    [SEED]: 0xFF8CB4D2, [PLANT]: 0xFF578B2E, [GUNPOWDER]: 0xFF444444,
    [BATTERY]: 0xFF00CCFF, [WIRE]: 0xFF333333, [BULB]: 0xFF555555
};

// 狀態網格
let grid = new Uint8Array(width * height);
let tempGrid = new Float32Array(width * height);
let lifeGrid = new Int16Array(width * height);
let chargeGrid = new Float32Array(width * height);

// 雙緩衝與快取
let nextGrid = new Uint8Array(width * height);
let nextTemp = new Float32Array(width * height);
let nextCharge = new Float32Array(width * height);

let currentElement = SAND, isInteracting = false, lastX = 0, lastY = 0;
let simSteps = 4, brushSize = 8, ambientTemp = 20;
let visualMode = 'NORMAL'; 
let isRightClick = false;

const screenImg = ctx.createImageData(width, height);
const idx = (x, y) => x + y * width;

function place(x, y, type) {
    if (x < 0 || x >= width || y < 0 || y >= height) return;
    let i = idx(x, y);
    if (grid[i] !== EMPTY && type !== EMPTY && type !== FIRE && type !== LAVA) return;
    
    grid[i] = type;
    tempGrid[i] = PROPS[type].baseTemp !== undefined ? PROPS[type].baseTemp : ambientTemp;
    chargeGrid[i] = 0;
    
    if (type === FIRE) lifeGrid[i] = 30 + Math.random() * 40;
    else if (type === SMOKE) lifeGrid[i] = 40 + Math.random() * 60;
    else if (type === STEAM) lifeGrid[i] = 60 + Math.random() * 80;
    else if (type === SEED) lifeGrid[i] = 100;
    else if (type === PLANT) lifeGrid[i] = 300; 
    else lifeGrid[i] = 0;
}

function drawLine(x0, y0, x1, y1, type) {
    let dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
    let sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, err = dx - dy;
    let actualType = isRightClick ? EMPTY : type;
    while(true) {
        let b2 = brushSize * brushSize;
        for(let i = -brushSize; i <= brushSize; i++) {
            for(let j = -brushSize; j <= brushSize; j++) {
                if(i*i + j*j <= b2) place(x0 + i, y0 + j, actualType);
            }
        }
        if (x0 === x1 && y0 === y1) break;
        let e2 = 2 * err;
        if (e2 > -dy) { err -= dy; x0 += sx; }
        if (e2 < dx) { err += dx; y0 += sy; }
    }
}

function update() {
    if (isInteracting) drawLine(lastX, lastY, lastX, lastY, currentElement);

    for(let s = 0; s < simSteps; s++) {
        nextGrid.set(grid);
        nextTemp.set(tempGrid);
        nextCharge.set(chargeGrid);

        for(let y = 0; y < height; y++) {
            for(let x = 0; x < width; x++) {
                let i = idx(x, y);
                let type = grid[i];
                if (type === EMPTY && tempGrid[i] === ambientTemp && chargeGrid[i] === 0) continue;

                if (PROPS[type].baseTemp !== undefined && (type === FIRE || type === LAVA)) {
                    nextTemp[i] = PROPS[type].baseTemp;
                } else {
                    nextTemp[i] -= (nextTemp[i] - ambientTemp) * PROPS[type].coolRate * 0.05;
                }

                if (type === BATTERY) nextCharge[i] = 1.0;
                else nextCharge[i] *= 0.85;

                const dx = [0, 0, -1, 1], dy = [-1, 1, 0, 0];
                for(let k = 0; k < 4; k++) {
                    let nx = x + dx[k], ny = y + dy[k];
                    if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                        let nid = idx(nx, ny);
                        let nType = grid[nid];

                        let tDiff = tempGrid[i] - tempGrid[nid];
                        if (tDiff > 0.5) {
                            let cond = (PROPS[type].conduct + PROPS[nType].conduct) * 0.1;
                            nextTemp[nid] += tDiff * cond;
                        }

                        if (PROPS[type].isConductor && PROPS[nType].isConductor) {
                            let cDiff = chargeGrid[i] - chargeGrid[nid];
                            if (cDiff > 0.05) nextCharge[nid] += cDiff * 0.7;
                        }

                        // --- 核心修改：大幅降低延燒機率 ---
                        if (type === FIRE || type === LAVA || tempGrid[i] > 200) {
                            if (PROPS[nType].igniteTemp && tempGrid[i] > PROPS[nType].igniteTemp) {
                                // 將機率調低到 0.012，讓火燒得極慢
                                if (Math.random() < 0.012) {
                                    nextGrid[nid] = FIRE; 
                                    lifeGrid[nid] = 40 + Math.random() * 40;
                                    nextTemp[nid] = 800;
                                }
                            }
                        }
                    }
                }
                if (type === BULB && chargeGrid[i] > 0.4) nextTemp[i] += 15;
            }
        }
        grid.set(nextGrid);
        tempGrid.set(nextTemp);
        chargeGrid.set(nextCharge);

        let processed = new Uint8Array(width * height);
        let scanUp = (s % 2 === 0);
        for (let y = scanUp ? height - 1 : 0; scanUp ? y >= 0 : y < height; scanUp ? y-- : y++) {
            let leftToRight = Math.random() > 0.5;
            for (let x = (leftToRight ? 0 : width - 1); (leftToRight ? x < width : x >= 0); (leftToRight ? x++ : x--)) {
                let i = idx(x, y);
                let type = grid[i];
                if (type === EMPTY || processed[i] || PROPS[type].isWall) continue;

                if (type === FIRE || type === SMOKE || type === STEAM) {
                    if (--lifeGrid[i] <= 0) { 
                        grid[i] = (type === FIRE && Math.random() < 0.6) ? SMOKE : EMPTY; 
                        continue; 
                    }
                }

                if (type === GUNPOWDER && tempGrid[i] >= PROPS[GUNPOWDER].igniteTemp) { explode(x, y, 12); continue; }
                if (type === TNT && (tempGrid[i] >= PROPS[TNT].igniteTemp || chargeGrid[i] > 0.7)) { explode(x, y, 35); continue; }
                
                if ([SAND, DIRT, WET_SAND, GUNPOWDER, COAL, SEED].includes(type)) {
                    if (type === SEED) handleSeed(x, y, i, processed);
                    else moveSolid(x, y, i, processed);
                }
                else if (type === PLANT) growPlant(x, y, i, processed);
                else if ([WATER, OIL, ACID, LAVA, GALLIUM].includes(type)) moveLiquid(x, y, i, type, processed);
                else if ([FIRE, STEAM, SMOKE].includes(type)) moveGas(x, y, i, type, processed);
                
                checkStateChange(x, y, i, type);
            }
        }
    }
}

function handleSeed(x, y, i, processed) {
    let hasWater = false;
    const dx = [0, 0, -1, 1], dy = [-1, 1, 0, 0];
    for(let k = 0; k < 4; k++) {
        let nx = x + dx[k], ny = y + dy[k];
        if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
            let nid = idx(nx, ny);
            if(grid[nid] === WATER || grid[nid] === WET_DIRT || grid[nid] === WET_SAND) hasWater = true;
        }
    }
    if(hasWater && Math.random() < 0.03) { 
        grid[i] = PLANT; 
        lifeGrid[i] = 100 + Math.random()*100; 
    } else {
        moveSolid(x, y, i, processed);
    }
}

function checkStateChange(x, y, i, type) {
    if (type === ICE && tempGrid[i] > 5) grid[i] = WATER;
    if (type === WATER) {
        if (tempGrid[i] < -2) grid[i] = ICE;
        else if (tempGrid[i] > 100) { grid[i] = STEAM; lifeGrid[i] = 80; }
    }
    if (type === STONE && tempGrid[i] > 1100) grid[i] = LAVA;
    if (type === LAVA && tempGrid[i] < 700) grid[i] = STONE;
    
    if (type === ACID && Math.random() < 0.1) {
        const dx = [0, 0, -1, 1], dy = [-1, 1, 0, 0];
        for(let k = 0; k < 4; k++) {
            let nx = x + dx[k], ny = y + dy[k];
            if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                let nid = idx(nx, ny);
                if (grid[nid] !== EMPTY && grid[nid] !== ACID && !PROPS[grid[nid]].isWall) {
                    grid[nid] = EMPTY; grid[i] = EMPTY; break;
                }
            }
        }
    }
}

function moveSolid(x, y, i, processed) {
    if (y >= height - 1) return;
    let down = i + width;
    if (grid[down] === EMPTY || (PROPS[grid[down]].density > 0 && PROPS[grid[down]].density < PROPS[grid[i]].density)) {
        swap(i, down, processed); return;
    }
    let dir = Math.random() < 0.5 ? 1 : -1;
    let side = i + width + dir;
    if (x + dir >= 0 && x + dir < width && grid[side] === EMPTY) swap(i, side, processed);
}

function moveLiquid(x, y, i, type, processed) {
    let v = PROPS[type].viscosity || 1;
    if (Math.random() > (1 / v)) return; 
    let down = i + width;
    if (y < height - 1 && (grid[down] === EMPTY || (PROPS[grid[down]].density > 0 && PROPS[grid[down]].density < PROPS[type].density))) {
        swap(i, down, processed);
    } else {
        let dir = Math.random() < 0.5 ? 1 : -1;
        let side = i + dir;
        if (x + dir >= 0 && x + dir < width && grid[side] === EMPTY) swap(i, side, processed);
    }
}

function moveGas(x, y, i, type, processed) {
    if (y <= 0) { if (Math.random() < 0.05) grid[i] = EMPTY; return; }
    let dirX = (Math.random() * 3 | 0) - 1;
    let tx = x + dirX, ty = y - 1;
    if (tx >= 0 && tx < width && ty >= 0) {
        let target = idx(tx, ty);
        if (grid[target] === EMPTY) swap(i, target, processed);
    }
}

function growPlant(x, y, i, processed) {
    if (lifeGrid[i] <= 0 || Math.random() > 0.1) return;
    let dirX = (Math.random() * 3 | 0) - 1;
    let dirY = (Math.random() * 3 | 0) - 2; 
    let tx = x + dirX, ty = y + dirY;
    if (tx >= 0 && tx < width && ty >= 0 && ty < height) {
        let target = idx(tx, ty);
        if (grid[target] === EMPTY) {
            grid[target] = PLANT; 
            lifeGrid[target] = lifeGrid[i] - 1; 
            processed[target] = 1;
            tempGrid[target] = tempGrid[i];
        }
    }
}

function explode(ex, ey, r) {
    let r2 = r * r;
    for (let i = -r; i <= r; i++) {
        for (let j = -r; j <= r; j++) {
            if (i*i + j*j < r2) {
                let tx = ex+i, ty = ey+j;
                if (tx >= 0 && tx < width && ty >= 0 && ty < height) {
                    let d = idx(tx, ty);
                    if (!PROPS[grid[d]].isWall || Math.random() < 0.4) {
                        grid[d] = Math.random() < 0.3 ? FIRE : EMPTY;
                        tempGrid[d] = 1200; lifeGrid[d] = 40;
                    }
                }
            }
        }
    }
}

function swap(a, b, processed) {
    let t = grid[a]; grid[a] = grid[b]; grid[b] = t;
    let te = tempGrid[a]; tempGrid[a] = tempGrid[b]; tempGrid[b] = te;
    let l = lifeGrid[a]; lifeGrid[a] = lifeGrid[b]; lifeGrid[b] = l;
    let c = chargeGrid[a]; chargeGrid[a] = chargeGrid[b]; chargeGrid[b] = c;
    if (processed) processed[b] = 1;
}

function draw() {
    const data32 = new Uint32Array(screenImg.data.buffer);
    for (let i = 0; i < width * height; i++) {
        let type = grid[i];
        if (visualMode === 'NORMAL') {
            let color = COLORS_HEX[type];
            if (chargeGrid[i] > 0.1) {
                if (type === WIRE) color = 0xFF99FFFF;
                else if (type === BULB) color = 0xFFFFFFFF;
            }
            if (type === FIRE) {
                color = lifeGrid[i] > 30 ? 0xFF32C8FF : 0xFF0055FF; 
            }
            data32[i] = color;
        } else {
            let t = tempGrid[i];
            if (t < 0) data32[i] = 0xFFFF5500;
            else if (t < 40) data32[i] = 0xFFBB0000;
            else if (t < 100) data32[i] = 0xFF00AA00;
            else if (t < 500) data32[i] = 0xFF0000FF;
            else data32[i] = 0xFFFFFFFF;
        }
    }
    const offscreen = document.createElement('canvas');
    offscreen.width = width; offscreen.height = height;
    offscreen.getContext('2d').putImageData(screenImg, 0, 0);
    ctx.clearRect(0,0, canvas.width, canvas.height);
    ctx.drawImage(offscreen, 0, 0, canvas.width, canvas.height);
}

function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    let cx = e.touches ? e.touches[0].clientX : e.clientX, cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { 
        x: Math.floor(((cx - rect.left) / rect.width) * width), 
        y: Math.floor(((cy - rect.top) / rect.height) * height) 
    };
}

canvas.onmousedown = e => { isInteracting = true; isRightClick = (e.button === 2); let p = getPos(e); lastX = p.x; lastY = p.y; };
window.onmousemove = e => { let p = getPos(e); if(isInteracting) drawLine(lastX, lastY, p.x, p.y, currentElement); lastX = p.x; lastY = p.y; };
window.onmouseup = () => isInteracting = false;
canvas.oncontextmenu = e => e.preventDefault();

document.getElementById('toolbar').onclick = e => {
    const btn = e.target.closest('button');
    if (!btn || btn.id === 'clearBtn') return;
    document.querySelectorAll('#toolbar button').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    currentElement = ELEMENT_MAP[btn.getAttribute('data-type')];
};

document.getElementById('clearBtn').onclick = () => { grid.fill(0); tempGrid.fill(ambientTemp); chargeGrid.fill(0); lifeGrid.fill(0); };

const ambR = document.getElementById('ambientRange'), ambN = document.getElementById('ambientNum');
function syncAmbient(val) { ambientTemp = parseInt(val); ambR.value = val; ambN.value = val; }
ambR.oninput = e => syncAmbient(e.target.value); ambN.oninput = e => syncAmbient(e.target.value);

const spdR = document.getElementById('speedRange'), spdN = document.getElementById('speedNum');
function syncSpeed(val) { simSteps = parseInt(val); spdR.value = val; spdN.value = val; }
spdR.oninput = e => syncSpeed(e.target.value); spdN.oninput = e => syncSpeed(e.target.value);

const bruR = document.getElementById('brushRange'), bruN = document.getElementById('brushNum');
function syncBrush(val) { brushSize = parseInt(val); bruR.value = val; bruN.value = val; }
bruR.oninput = e => syncBrush(e.target.value); bruN.oninput = e => syncBrush(e.target.value);

document.getElementById('viewNormal').onclick = () => setView('NORMAL', 'viewNormal');
document.getElementById('viewThermal').onclick = () => setView('THERMAL', 'viewThermal');
function setView(mode, id) { visualMode = mode; document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active')); document.getElementById(id).classList.add('active'); }

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
